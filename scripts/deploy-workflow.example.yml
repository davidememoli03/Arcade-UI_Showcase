# GitHub rifiuta il push di file in .github/workflows/ se il token non ha lo scope "workflow"
# (errore: refusing to allow an OAuth App ... without `workflow` scope).
# Opzioni: (1) Incolla questo YAML in Repo → .github/workflows/deploy.yml da browser.
# (2) `gh auth refresh -h github.com -s workflow` poi commit/push del workflow da CLI.
#
name: Deploy Showcase

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run build
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
